<style>
@font-face {
  font-family: Beway;
  src: url("Beway.otf") format("opentype");
  font-display: swap;
}

:root {
  --sun-size: clamp(72px, 16vmin, 140px);
  --sun-top: max(5vh, 24px);
  --sun-right: max(8vw, 22px);
  --gold: #ffd36b;
  --ink: #04090c;
  --text: rgba(225, 236, 255, .78);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Open Sans", sans-serif;
  color: var(--text);
  /* dawn sky, lit from where the sun sits */
  background:
    radial-gradient(circle at calc(100% - var(--sun-right) - var(--sun-size) / 2) calc(var(--sun-top) + var(--sun-size) / 2),
      #ffe9a8 0, #ffc66b 4%, #f08f4f 11%, #9c6a6e 20%, #2f7186 34%, #12425c 55%, #0a2233 78%, #06131e 100%);
  background-color: #06131e;
  -webkit-tap-highlight-color: transparent;
}

#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ---------- sun ---------- */
.sun {
  position: fixed;
  top: var(--sun-top);
  right: var(--sun-right);
  width: var(--sun-size);
  height: var(--sun-size);
  padding: 0;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  z-index: 5;
  background: radial-gradient(circle at 40% 38%, #fffbe6 0, #ffe58a 35%, #ffc53d 70%, #ffae22 100%);
  box-shadow:
    0 0 calc(var(--sun-size) * .25) rgba(255, 230, 140, .95),
    0 0 calc(var(--sun-size) * .7) rgba(255, 190, 80, .6),
    0 0 calc(var(--sun-size) * 1.6) rgba(255, 160, 60, .35);
  animation: breathe 6s ease-in-out infinite;
  transition: transform .4s cubic-bezier(.3, 1.4, .5, .9);
}

/* slow rays */
.sun::before {
  content: "";
  position: absolute;
  inset: -160%;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 226, 150, .22) 0deg 5deg, transparent 5deg 15deg);
  -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%);
          mask: radial-gradient(circle, #000 18%, transparent 68%);
  animation: spin 140s linear infinite;
  pointer-events: none;
  z-index: -1;
}

.sun:hover,
.sun:focus-visible { transform: scale(1.06); }
.sun:focus-visible { outline: 2px solid #fff; outline-offset: 6px; }
.sun[aria-expanded="true"] { transform: scale(.92); }

@keyframes breathe {
  50% {
    box-shadow:
      0 0 calc(var(--sun-size) * .3) rgba(255, 230, 140, 1),
      0 0 calc(var(--sun-size) * .9) rgba(255, 190, 80, .7),
      0 0 calc(var(--sun-size) * 2) rgba(255, 160, 60, .4);
  }
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ONE / TWO open out of the sun */
.sun-menu {
  position: fixed;
  top: calc(var(--sun-top) + var(--sun-size) / 2);
  right: calc(var(--sun-right) + var(--sun-size) / 2);
  width: 0;
  height: 0;
  z-index: 4;
}

.ray {
  position: absolute;
  left: 0;
  top: 0;
  width: 150px;
  padding: 10px 14px;
  border-radius: 999px;
  text-align: center;
  text-decoration: none;
  color: #2a1400;
  background: linear-gradient(135deg, #ffe08a, #ffa43a);
  box-shadow: 0 6px 24px rgba(255, 150, 50, .45);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%) scale(.3);
  transition: transform .55s cubic-bezier(.3, 1.4, .5, .9), opacity .35s;
}

.ray b {
  display: block;
  font-size: 20px;
  letter-spacing: .12em;
}

.ray span {
  display: block;
  font-size: 12px;
  opacity: .8;
}

.ray:hover,
.ray:focus-visible {
  background: linear-gradient(135deg, #fff3c4, #ffc35c);
  outline: none;
}

.open .ray { opacity: 1; pointer-events: auto; }
.open .ray-one {
  transform: translate(calc(-50% - var(--sun-size) * 1.05 - 40px), calc(-50% + var(--sun-size) * .35)) scale(1);
}
.open .ray-two {
  transform: translate(calc(-50% - var(--sun-size) * .55 - 30px), calc(-50% + var(--sun-size) * 1.05 + 30px)) scale(1);
  transition-delay: .08s;
}

.hint {
  position: fixed;
  top: calc(var(--sun-top) + var(--sun-size) + 18px);
  right: var(--sun-right);
  width: var(--sun-size);
  text-align: center;
  font-family: Beway, sans-serif;
  font-size: 14px;
  color: rgba(255, 240, 210, .85);
  white-space: nowrap;
  display: flex;
  justify-content: center;
  opacity: 0;
  transition: opacity 1.2s;
  pointer-events: none;
  z-index: 3;
}
.hint.show { opacity: 1; }

/* ---------- landscape ---------- */
.scene {
  position: fixed;
  bottom: 0;
  left: 50%;
  width: min(max(100vw, 125vh), 187vh);
  transform: translateX(-50%);
  z-index: 2;
}

.scene svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.hotspot { cursor: pointer; outline: none; }

.label {
  font-family: Beway, sans-serif;
  font-size: 20px;
  letter-spacing: .14em;
  fill: rgba(255, 236, 200, .92);
  opacity: 0;
  transition: opacity .4s;
  pointer-events: none;
}

.hotspot:hover .label,
.hotspot:focus-visible .label { opacity: 1; }

@media (hover: none) {
  .label { opacity: .7; }
}

.cave-glow { opacity: .55; transition: opacity .6s; }
.cave-link:hover .cave-glow,
.cave-link:focus-visible .cave-glow { opacity: 1; }

.wanderer { transition: transform .5s; transform-box: fill-box; transform-origin: bottom center; }
.wanderer-link:hover .wanderer,
.wanderer-link:focus-visible .wanderer { transform: scale(1.06); }

.flame { transform-box: fill-box; transform-origin: bottom center; animation: flicker 1.3s ease-in-out infinite alternate; }
.flame.f2 { animation-duration: .9s; animation-delay: -.4s; }
.flame.f3 { animation-duration: 1.7s; animation-delay: -.8s; }

@keyframes flicker {
  0% { transform: scale(1, 1); }
  35% { transform: scale(.92, 1.12) skewX(3deg); }
  70% { transform: scale(1.05, .9) skewX(-4deg); }
  100% { transform: scale(.97, 1.06); }
}

.wall-light { animation: wall 2.2s ease-in-out infinite alternate; }
@keyframes wall { 50% { opacity: .78; } 100% { opacity: .95; } }

.sign-glow { animation: signpulse 3.5s ease-in-out infinite; }
@keyframes signpulse { 50% { opacity: .45; } }

/* ---------- footer ---------- */
.credit {
  position: fixed;
  right: 0;
  bottom: 0;
  padding: 0 max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) 16px;
  text-align: right;
  font-family: Beway, sans-serif;
  font-size: 15px;
  color: rgba(200, 220, 255, .45);
  z-index: 3;
}
.credit a { color: rgba(225, 236, 255, .7); text-decoration: none; transition: color .3s; }
.credit a:hover, .credit a:focus-visible { color: #fff; }

/* ---------- DISCOVER dialog ---------- */
dialog {
  width: min(92vw, 560px);
  max-height: 86vh;
  padding: 3.2rem 1.6rem 2.2rem;
  border: 1px solid rgba(255, 220, 150, .25);

  color: #eef3ff;
  text-align: center;
  background: linear-gradient(160deg, rgba(20, 44, 64, .96), rgba(44, 30, 60, .96));
  box-shadow: 0 20px 80px rgba(0, 0, 0, .55), 0 0 60px rgba(255, 190, 90, .15);
}
dialog::backdrop { background: rgba(3, 10, 16, .6); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
dialog h1 { margin: 0 0 1.4rem; font-size: 22px; letter-spacing: .2em; }
dialog p { margin: 0 0 1.1rem; font-size: 17px; line-height: 1.65; }
dialog .small { font-size: 14px; opacity: .7; margin-top: 1.6rem; }
dialog a { color: var(--gold); font-weight: 700; text-decoration: none; border-bottom: 1px solid currentColor; }
dialog a:hover, dialog a:focus-visible { color: #fff; outline: none; }
.close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 40px;
  height: 40px;
  border: 1px solid rgba(255, 255, 255, .2);
  border-radius: 50%;
  background: transparent;
  color: inherit;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
}
.close:hover, .close:focus-visible { background: rgba(255, 255, 255, .1); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

    menu.classList.toggle('open', open);
    sun.setAttribute('aria-expanded', open);
    for (var i = 0; i < rays.length; i++) rays[i].tabIndex = open ? 0 : -1;
  }

  sun.addEventListener('click', function (e) {
    e.stopPropagation();
    touched = true;
    hint.classList.remove('show');
    setMenu(!menu.classList.contains('open'));
  });

  document.addEventListener('click', function (e) {
    if (!menu.contains(e.target)) setMenu(false);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setMenu(false);
  });

  // gentle nudge if nobody has found the sun yet
  setTimeout(function () { if (!touched) hint.classList.add('show'); }, 2500);
  setTimeout(function () { hint.classList.remove('show'); }, 9000);

  // DISCOVER dialog, with a #discover fallback for browsers without <dialog>
  document.getElementById('sign').addEventListener('click', function (e) {
    if (typeof dialog.showModal === 'function') {
      e.preventDefault();
      dialog.showModal();
    }
  });
  dialog.querySelector('.close').addEventListener('click', function () { dialog.close(); });
  dialog.addEventListener('click', function (e) { if (e.target === dialog) dialog.close(); });

  // ---------- stars: fade out near the sun, a comet now and then ----------
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stars = [], comet = null, w, h, sx, sy, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var r = sun.getBoundingClientRect();
    sx = r.left + r.width / 2;
    sy = r.top + r.height / 2;
    var count = Math.min(260, Math.round(w * h / 4500));
    stars = [];
    for (var i = 0; i < count; i++) {
      var x = Math.random() * w, y = Math.random() * h * .8;
      var d = Math.hypot(x - sx, y - sy) / Math.hypot(w, h);
      stars.push({ x: x, y: y, r: Math.random() * 1.3 + .3, a: Math.min(1, Math.max(0, (d - .18) * 2.2)), p: Math.random() * 6.28, s: Math.random() * .02 + .005 });
    }
    if (still) draw();
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.p += s.s;
      ctx.globalAlpha = s.a * (.55 + .45 * Math.sin(s.p));
      ctx.fillStyle = '#e8eeff';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    if (comet) {
      comet.x += comet.vx; comet.y += comet.vy; comet.life -= 1;
      var g = ctx.createLinearGradient(comet.x, comet.y, comet.x - comet.vx * 18, comet.y - comet.vy * 18);
      g.addColorStop(0, 'rgba(255,255,255,.9)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = Math.min(1, comet.life / 30);
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(comet.x, comet.y);
      ctx.lineTo(comet.x - comet.vx * 18, comet.y - comet.vy * 18);
      ctx.stroke();
      if (comet.life <= 0) comet = null;
    } else if (Math.random() < .003) {
      comet = { x: Math.random() * w * .6, y: Math.random() * h * .3, vx: 6 + Math.random() * 4, vy: 2 + Math.random() * 2, life: 70 };
    }
    ctx.globalAlpha = 1;
    if (!still) requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  if (!still) requestAnimationFrame(draw);
})();
</script>
</body>
</html>
